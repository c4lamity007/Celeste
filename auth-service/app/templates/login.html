<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gateway</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand"><span class="brand-dot" aria-hidden="true"></span><span class="eyebrow">CELESTE AUTH</span></div>
    <h1>Welcome back</h1>
    <p>Sign in to manage licenses and installations.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <label>Password<input type="password" name="password" maxlength="256" required autofocus autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
