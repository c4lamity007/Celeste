allprojects { project ->
    project.afterEvaluate {
        if (project == project.rootProject) {
            def output = project.layout.buildDirectory.dir('module-qa/member-access/classes')
            def compileCheck = project.tasks.register('compileBetaMemberAccessCheck', JavaCompile) {
                dependsOn project.tasks.named('compileJava')
                source project.fileTree('beta-lab/member-access/src') { include '**/*.java' }
                source project.file('beta-lab/resource-provider/src/dev/c4lam/celeste/beta/fixture/NamedMinecraftContractLauncher.java')
                classpath = project.sourceSets.main.compileClasspath + project.sourceSets.main.output.classesDirs
                destinationDirectory = output
                options.release = 21
                options.encoding = 'UTF-8'
                options.compilerArgs += ['-Xlint:all', '-Werror']
            }
            project.tasks.register('betaMemberAccessCheck', JavaExec) {
                dependsOn compileCheck
                classpath = project.files(output) + project.sourceSets.main.output.classesDirs + project.sourceSets.main.runtimeClasspath
                mainClass = 'dev.c4lam.celeste.beta.fixture.NamedMinecraftContractLauncher'
                enableAssertions = true
                def mappingId = '1.21.11-net.fabricmc.yarn.1_21_11.1.21.11+build.6-v2'
                args 'members', new File(project.gradle.gradleUserHomeDir,
                    "caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-intermediary/${mappingId}/minecraft-merged-intermediary-${mappingId}.jar").absolutePath
                workingDir = project.layout.buildDirectory.dir('module-qa/member-access').get().asFile
                doFirst { workingDir.mkdirs() }
            }
        }
    }
}
