// Offline parent proxy lifecycle checks; never registers with or starts a real game.
allprojects { project ->
    project.afterEvaluate {
        if (project.plugins.hasPlugin('java') && project == project.rootProject) {
            def output = project.layout.buildDirectory.dir('module-qa/callbacks/classes')
            def compileCheck = project.tasks.register('compileBetaCallbacksCheck', JavaCompile) {
                dependsOn project.tasks.named('compileJava')
                source project.fileTree('beta-lab/callbacks/src') { include '**/*.java' }
                classpath = project.sourceSets.main.output.classesDirs
                destinationDirectory = output
                options.release = 21
                options.encoding = 'UTF-8'
                options.compilerArgs += ['-Xlint:all', '-Werror']
            }
            project.tasks.register('betaCallbacksCheck', JavaExec) {
                dependsOn compileCheck
                classpath = project.files(output) + project.sourceSets.main.output.classesDirs
                mainClass = 'dev.celestebeta.host.fixture.CallbacksCheck'
                enableAssertions = true
            }
        }
    }
}
