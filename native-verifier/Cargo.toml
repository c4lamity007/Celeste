[package]
name = "celeste-verify"
version = "1.0.0"
edition = "2024"
autobins = false

[[bin]]
name = "CelesteLauncher"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
rfd = { version = "0.15.4", default-features = false }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
winapi = { version = "0.3", features = ["combaseapi", "dpapi", "errhandlingapi", "fileapi", "knownfolders", "shlobj", "winbase", "wincrypt", "winnt"] }
winreg = "0.55"
wmi = "0.17"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
