plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'celeste-bootstrap'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Fabric Loader 0.19.3 supplies MixinExtras 0.5.4 as a nested dependency.
    // Keep Celeste's identity separate and use that canonical implementation.
    implementation include("com.github.oshi:oshi-core:7.6.0")
    implementation include("com.github.oshi:oshi-common:7.6.0")
    implementation include("net.java.dev.jna:jna:5.19.0")
    implementation include("net.java.dev.jna:jna-platform:5.19.0")
}

sourceSets {
    main {
        java {
            srcDir '../src/main/java'
            srcDir 'src/main/java'
            include 'dev/c4lam/celeste/auth/AuthConfig.java'
            include 'dev/c4lam/celeste/auth/AuthServiceClient.java'
            include 'dev/c4lam/celeste/auth/CredentialStore.java'
            include 'dev/c4lam/celeste/auth/Crypto.java'
            include 'dev/c4lam/celeste/auth/DpopProofSigner.java'
            include 'dev/c4lam/celeste/auth/GameIdentity.java'
            include 'dev/c4lam/celeste/auth/HardwareFingerprint.java'
            include 'dev/c4lam/celeste/auth/PortableHardwareFingerprint.java'
            include 'dev/c4lam/celeste/auth/InstallCredential.java'
            include 'dev/c4lam/celeste/auth/LaunchTicketStore.java'
            include 'dev/c4lam/celeste/auth/GatewayBridge.java'
            include 'dev/c4lam/celeste/auth/GatewayClient.java'
            include 'dev/c4lam/celeste/auth/GatewayPreLaunch.java'
            include 'dev/c4lam/celeste/auth/GatewayRuntime.java'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Validate the distributable with Fabric's real directory discovery and metadata parser.
// This does not initialize Minecraft, contact auth, or modify a launcher instance.
def bootstrapDiscoveryCheck = tasks.register('checkBootstrapMod', JavaExec) {
    dependsOn tasks.named('remapJar'), tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.c4lam.celeste.bootstrap.qa.CelesteBootstrapCheck'
    enableAssertions = true
    doFirst {
        def fixtureRoot = layout.buildDirectory.dir('bootstrap-discovery-check').get().asFile
        fixtureRoot.mkdirs()
        def loaderJar = configurations.compileClasspath.files.find { it.name.startsWith('fabric-loader-') && it.name.endsWith('.jar') }
        if (loaderJar == null) throw new GradleException('Fabric Loader dependency is unavailable')
        args = [tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath, loaderJar.absolutePath, fixtureRoot.absolutePath]
    }
}
tasks.named('check') { dependsOn bootstrapDiscoveryCheck }

// These fixtures are JavaExec assertions, not JUnit tests. Keep the real
// discovery check above mandatory while allowing Gradle 9's empty Test task.
tasks.named('test', Test) { failOnNoDiscoveredTests = false }

def folderActivationCheck = tasks.register('checkFolderActivation', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.c4lam.celeste.auth.FolderActivationCheck'
    enableAssertions = true
    onlyIf { System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') }
}
tasks.named('check') { dependsOn folderActivationCheck }
