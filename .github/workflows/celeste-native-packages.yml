name: Celeste native packages

on:
  push:
    branches:
      - codex/celeste-platform-packages-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            executable: CelesteLauncher.exe
          - platform: linux-x64
            runner: ubuntu-24.04
            executable: CelesteLauncher
          - platform: macos-arm64
            runner: macos-15
            executable: CelesteLauncher
          - platform: macos-x64
            runner: macos-15-intel
            executable: CelesteLauncher
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libsecret-tools libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-verifier
          key: ${{ matrix.platform }}
      - name: Native tests
        working-directory: native-verifier
        run: cargo test --locked
      - name: Build release
        working-directory: native-verifier
        run: cargo build --release --locked
      - name: Hardware collection smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: native-verifier/target/release/CelesteLauncher --check-hardware
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: bash tools/packaging/package-macos.sh '${{ matrix.platform }}'
      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/Celeste
          install -m 755 native-verifier/target/release/CelesteLauncher dist/Celeste/Celeste
          printf '%s\n' 'Celeste for Linux x64' 'Run ./Celeste from a graphical desktop session.' 'Requires an unlocked Secret Service (such as GNOME Keyring), secret-tool, and xdg-desktop-portal with a desktop backend.' 'Activate, choose an output folder, then move Celeste.jar into your Fabric 1.21.11 mods folder.' > dist/Celeste/README.txt
          tar -czf dist/Celeste-linux-x64.tar.gz -C dist Celeste
          rm -r dist/Celeste
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -LiteralPath native-verifier/target/release/CelesteLauncher.exe -Destination dist/Celeste.exe
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Celeste-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
