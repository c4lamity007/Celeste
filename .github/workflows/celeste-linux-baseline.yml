name: Celeste Linux compatibility package
on:
  push:
    branches: [codex/celeste-linux22-packages-20260919]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libsecret-tools libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-verifier
          key: linux-ubuntu22
      - name: Native tests
        working-directory: native-verifier
        run: cargo test --locked
      - name: Build release
        working-directory: native-verifier
        run: cargo build --release --locked
      - name: Validate and package
        run: |
          native-verifier/target/release/CelesteLauncher --check-hardware
          file native-verifier/target/release/CelesteLauncher
          objdump -T native-verifier/target/release/CelesteLauncher | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          mkdir -p dist/Celeste
          install -m 755 native-verifier/target/release/CelesteLauncher dist/Celeste/Celeste
          printf '%s\n' 'Celeste for Linux x64 (Ubuntu 22.04+ baseline)' 'Run ./Celeste from a graphical desktop session.' 'Requires secret-tool, an unlocked Secret Service such as GNOME Keyring, and xdg-desktop-portal with a desktop backend.' 'Activate, choose an output folder, then move Celeste.jar into your Fabric 1.21.11 mods folder.' > dist/Celeste/README.txt
          tar -czf dist/Celeste-linux-x64.tar.gz -C dist Celeste
      - uses: actions/upload-artifact@v4
        with:
          name: Celeste-linux-x64-ubuntu22
          path: dist/Celeste-linux-x64.tar.gz
          if-no-files-found: error
