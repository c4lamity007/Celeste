plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs.configureEach {
        vmArgs '--enable-native-access=ALL-UNNAMED', '-Djoml.nounsafe=true'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Hardware/monitor identity and Windows DPAPI credential protection.
    implementation include("com.github.oshi:oshi-core:7.6.0")
    implementation include("com.github.oshi:oshi-common:7.6.0")
    implementation include("net.java.dev.jna:jna:5.19.0")
    implementation include("net.java.dev.jna:jna-platform:5.19.0")
}

processResources {
    inputs.property 'version', project.version

    // Only Windows uses the optional system-media JNI bridge. Its development
    // path is Windows-specific and must not enter macOS/Linux resource builds.
    if (System.getProperty('os.name', '').toLowerCase().contains('windows')) {
        from('C:/Users/c4lam/Downloads/New folder (5)/MediaPlayerInfo.dll') {
            into 'mediaplayerinfo/natives/win'
        }
    }

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
